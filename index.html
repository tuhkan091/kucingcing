<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruang Curhat Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .background {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(139,92,246,0.35), transparent 30%),
        radial-gradient(circle at bottom right, rgba(6,182,212,0.35), transparent 30%),
        #0f172a;
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px 80px;
    }

    .hero {
      text-align: center;
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: 52px;
      font-weight: 700;
      background: linear-gradient(90deg, #38bdf8, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .hero p {
      color: #cbd5e1;
      font-size: 16px;
      max-width: 650px;
      margin: auto;
      line-height: 1.7;
    }

    .form-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 28px;
      backdrop-filter: blur(12px);
      margin-bottom: 35px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    }

    input,
    textarea {
      width: 100%;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.08);
      padding: 16px 18px;
      border-radius: 16px;
      color: white;
      margin-bottom: 16px;
      font-size: 15px;
    }

    textarea {
      min-height: 140px;
      resize: none;
    }

    input::placeholder,
    textarea::placeholder {
      color: #94a3b8;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 15px;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    .feed-title {
      font-size: 28px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .post {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      animation: fadeIn 0.4s ease;
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      font-size: 20px;
    }

    .username {
      font-size: 17px;
      font-weight: 600;
    }

    .time {
      color: #94a3b8;
      font-size: 13px;
    }

    .story {
      line-height: 1.9;
      font-size: 16px;
      color: #f8fafc;
      white-space: pre-wrap;
      margin-bottom: 22px;
    }

    .reply-box {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    .reply-box input {
      margin: 0;
    }

    .reply-btn {
      border: none;
      padding: 12px 18px;
      border-radius: 14px;
      background: #22c55e;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    .replies {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .reply-item {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 14px 16px;
      border-left: 4px solid #8b5cf6;
    }

    .reply-user {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #c4b5fd;
    }

    .reply-text {
      font-size: 14px;
      line-height: 1.7;
      color: #f1f5f9;
    }

    .empty {
      text-align: center;
      padding: 40px;
      background: rgba(255,255,255,0.04);
      border-radius: 24px;
      color: #94a3b8;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 36px;
      }

      .reply-box {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="background"></div>

  <div class="container">

    <div class="hero">
      <h1>Ruang Curhat</h1>
      <p>
        Tempat anonim untuk berbagi cerita, keluh kesah, dan mendapatkan dukungan dari orang lain.
      </p>
    </div>

    <div class="form-card">
      <form id="confessForm">
        <input type="text" id="username" placeholder="Nama atau Username" required>

        <textarea id="story" placeholder="Tulis curhatanmu di sini..." required></textarea>

        <button type="submit" class="btn">Kirim Curhatan</button>
      </form>
    </div>

    <h2 class="feed-title">Cerita Terbaru</h2>

    <div class="feed" id="feed"></div>

  </div>

  <script>
    const form = document.getElementById('confessForm');
    const feed = document.getElementById('feed');

    let posts = JSON.parse(localStorage.getItem('confessionPosts')) || [];

    function savePosts() {
      localStorage.setItem('confessionPosts', JSON.stringify(posts));
    }

    function renderPosts() {
      feed.innerHTML = '';

      if (posts.length === 0) {
        feed.innerHTML = `
          <div class="empty">
            Belum ada curhatan yang dibagikan.
          </div>
        `;
        return;
      }

      [...posts].reverse().forEach((post, index) => {
        const postIndex = posts.length - 1 - index;

        const div = document.createElement('div');
        div.classList.add('post');

        div.innerHTML = `
          <div class="post-header">
            <div class="profile">
              <div class="avatar">
                ${post.username.charAt(0).toUpperCase()}
              </div>

              <div>
                <div class="username">${post.username}</div>
                <div class="time">${post.time}</div>
              </div>
            </div>
          </div>

          <div class="story">${post.story}</div>

          <div class="replies">
            ${(post.replies || []).map(reply => `
              <div class="reply-item">
                <div class="reply-user">${reply.user}</div>
                <div class="reply-text">${reply.text}</div>
              </div>
            `).join('')}
          </div>

          <div class="reply-box">
            <input type="text" id="reply-${postIndex}" placeholder="Tulis balasan untuk curhatan ini...">
            <button class="reply-btn" onclick="addReply(${postIndex})">
              Balas
            </button>
          </div>
        `;

        feed.appendChild(div);
      });
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const newPost = {
        username: document.getElementById('username').value,
        story: document.getElementById('story').value,
        time: new Date().toLocaleString('id-ID'),
        replies: []
      };

      posts.push(newPost);
      savePosts();
      renderPosts();
      form.reset();
    });

    function addReply(index) {
      const replyInput = document.getElementById(`reply-${index}`);
      const text = replyInput.value.trim();

      if (text === '') return;

      posts[index].replies.push({
        user: 'Anonim',
        text: text
      });

      savePosts();
      renderPosts();
    }

    renderPosts();
  </script>

</body>
</html>
