<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buku Tamu Modern</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      color: white;
    }

    .wrapper {
      width: 100%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 25px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #cbd5e1;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #e2e8f0;
    }

    .input-group input,
    .input-group textarea {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 15px;
    }

    .input-group textarea {
      min-height: 110px;
      resize: none;
    }

    .input-group input::placeholder,
    .input-group textarea::placeholder {
      color: #cbd5e1;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .guest-list {
      max-height: 600px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .guest-item {
      background: rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      animation: fadeIn 0.4s ease;
    }

    .guest-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .guest-name {
      font-size: 18px;
      font-weight: 600;
    }

    .guest-email {
      font-size: 13px;
      color: #cbd5e1;
    }

    .guest-message {
      margin: 12px 0;
      line-height: 1.6;
      color: #f8fafc;
    }

    .guest-time {
      font-size: 12px;
      color: #94a3b8;
    }

    .delete-btn {
      background: #ef4444;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      color: #cbd5e1;
      padding: 40px 20px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 850px) {
      .wrapper {
        grid-template-columns: 1fr;
      }

      .title {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">

    <div class="card">
      <h1 class="title">Buku Tamu</h1>
      <p class="subtitle">
        Silakan isi data dan pesan Anda pada formulir berikut.
      </p>

      <form id="guestForm">
        <div class="input-group">
          <label>Nama Lengkap</label>
          <input type="text" id="name" placeholder="Masukkan nama" required>
        </div>

        <div class="input-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="Masukkan email" required>
        </div>

        <div class="input-group">
          <label>Pesan</label>
          <textarea id="message" placeholder="Tulis pesan Anda..." required></textarea>
        </div>

        <button type="submit" class="btn">Simpan Buku Tamu</button>
      </form>
    </div>

    <div class="card">
      <h2 class="title">Daftar Tamu</h2>
      <div class="guest-list" id="guestList"></div>
    </div>

  </div>

  <script>
    const form = document.getElementById('guestForm');
    const guestList = document.getElementById('guestList');

    let guests = JSON.parse(localStorage.getItem('guestbookModern')) || [];

    function saveData() {
      localStorage.setItem('guestbookModern', JSON.stringify(guests));
    }

    function renderGuests() {
      guestList.innerHTML = '';

      if (guests.length === 0) {
        guestList.innerHTML = `
          <div class="empty">
            Belum ada tamu yang mengisi buku tamu.
          </div>
        `;
        return;
      }

      guests.reverse().forEach((guest, index) => {
        const item = document.createElement('div');
        item.classList.add('guest-item');

        item.innerHTML = `
          <div class="guest-header">
            <div>
              <div class="guest-name">${guest.name}</div>
              <div class="guest-email">${guest.email}</div>
            </div>
            <button class="delete-btn" onclick="deleteGuest(${guests.length - 1 - index})">
              Hapus
            </button>
          </div>

          <div class="guest-message">
            ${guest.message}
          </div>

          <div class="guest-time">
            ${guest.time}
          </div>
        `;

        guestList.appendChild(item);
      });

      guests.reverse();
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const guest = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value,
        time: new Date().toLocaleString('id-ID')
      };

      guests.push(guest);
      saveData();
      renderGuests();
      form.reset();
    });

    function deleteGuest(index) {
      if (confirm('Hapus data tamu ini?')) {
        guests.splice(index, 1);
        saveData();
        renderGuests();
      }
    }

    renderGuests();
  </script>
</body>
</html>
