<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Pesanan Minuman</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      color: white;
      padding: 40px 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      font-size: 42px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #38bdf8, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: #cbd5e1;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 28px;
      backdrop-filter: blur(12px);
      margin-bottom: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 15px 18px;
      border: none;
      outline: none;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 15px;
    }

    option {
      color: black;
    }

    textarea {
      resize: none;
      min-height: 100px;
      margin-bottom: 18px;
    }

    input::placeholder,
    textarea::placeholder {
      color: #94a3b8;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .section-title {
      font-size: 28px;
      margin-bottom: 18px;
    }

    .orders {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .order-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      animation: fadeIn 0.4s ease;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .name {
      font-size: 20px;
      font-weight: 600;
    }

    .time {
      color: #94a3b8;
      font-size: 13px;
    }

    .status {
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
    }

    .pending {
      background: rgba(234,179,8,0.2);
      color: #fde047;
    }

    .done {
      background: rgba(34,197,94,0.2);
      color: #4ade80;
    }

    .drink {
      font-size: 18px;
      margin-bottom: 10px;
      color: #e2e8f0;
    }

    .notes {
      line-height: 1.8;
      color: #f8fafc;
      margin-bottom: 18px;
      white-space: pre-wrap;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      font-weight: 600;
      transition: 0.3s;
    }

    .complete-btn {
      background: #22c55e;
    }

    .edit-btn {
      background: #3b82f6;
    }

    .delete-btn {
      background: #ef4444;
    }

    .action-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .empty {
      text-align: center;
      padding: 40px;
      background: rgba(255,255,255,0.05);
      border-radius: 24px;
      color: #94a3b8;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <h1>Pesanan Minuman</h1>
      <p>Sistem pemesanan minuman digital sederhana dan modern.</p>
    </div>

    <div class="card">
      <form id="orderForm">

        <div class="grid">
          <input type="text" id="customer" placeholder="Nama Pemesan" required>

          <select id="drink" required>
            <option value="">Pilih Minuman</option>
            <option>Es Teh</option>
            <option>Kopi Susu</option>
            <option>Cappuccino</option>
            <option>Matcha Latte</option>
            <option>Coklat Panas</option>
            <option>Jus Jeruk</option>
          </select>
        </div>

        <textarea id="notes" placeholder="Catatan pesanan (contoh: less sugar, extra ice)"></textarea>

        <button type="submit" class="btn">Tambah Pesanan</button>

      </form>
    </div>

    <h2 class="section-title">Daftar Pesanan</h2>

    <div class="orders" id="orders"></div>

  </div>

  <script>
    const form = document.getElementById('orderForm');
    const ordersContainer = document.getElementById('orders');

    let orders = JSON.parse(localStorage.getItem('drinkOrders')) || [];

    function saveOrders() {
      localStorage.setItem('drinkOrders', JSON.stringify(orders));
    }

    function renderOrders() {
      ordersContainer.innerHTML = '';

      if (orders.length === 0) {
        ordersContainer.innerHTML = `
          <div class="empty">
            Belum ada pesanan minuman.
          </div>
        `;
        return;
      }

      [...orders].reverse().forEach((order, index) => {
        const realIndex = orders.length - 1 - index;

        const card = document.createElement('div');
        card.classList.add('order-card');

        card.innerHTML = `
          <div class="top">
            <div>
              <div class="name">${order.customer}</div>
              <div class="time">${order.time}</div>
            </div>

            <div class="status ${order.completed ? 'done' : 'pending'}">
              ${order.completed ? 'Pesanan Diterima' : 'Sedang Diproses'}
            </div>
          </div>

          <div class="drink">
            ☕ ${order.drink}
          </div>

          <div class="notes">
            ${order.notes || '-'}
          </div>

          <div class="actions">
            ${!order.completed ? `
              <button class="action-btn complete-btn" onclick="completeOrder(${realIndex})">
                Tandai Selesai
              </button>
            ` : `
              <button class="action-btn edit-btn" onclick="editOrder(${realIndex})">
                Ubah Pesanan
              </button>
            `}

            <button class="action-btn delete-btn" onclick="deleteOrder(${realIndex})">
              Hapus
            </button>
          </div>
        `;

        ordersContainer.appendChild(card);
      });
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const newOrder = {
        customer: document.getElementById('customer').value,
        drink: document.getElementById('drink').value,
        notes: document.getElementById('notes').value,
        completed: false,
        time: new Date().toLocaleString('id-ID')
      };

      orders.push(newOrder);
      saveOrders();
      renderOrders();
      form.reset();
    });

    function completeOrder(index) {
      orders[index].completed = true;
      saveOrders();
      renderOrders();
    }

    function editOrder(index) {
      const newDrink = prompt('Ubah pesanan minuman:', orders[index].drink);

      if (newDrink !== null && newDrink.trim() !== '') {
        orders[index].drink = newDrink;

        const newNotes = prompt('Ubah catatan pesanan:', orders[index].notes);

        if (newNotes !== null) {
          orders[index].notes = newNotes;
        }

        saveOrders();
        renderOrders();
      }
    }

    function deleteOrder(index) {
      if (confirm('Hapus pesanan ini?')) {
        orders.splice(index, 1);
        saveOrders();
        renderOrders();
      }
    }

    renderOrders();
  </script>

</body>
</html>
